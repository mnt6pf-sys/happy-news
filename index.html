<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <!-- ↓これがお相手のサイトの画像ブロックを回避する魔法のタグです↓ -->
  <meta name="referrer" content="no-referrer">
  
  <title>GOOD NEWS TODAY | 前向きな話題を厳選 あなたの一日を明るい気持ちでスタートできるニュースサイト</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
  <header class="bg-white border-b-4 border-yellow-400 p-6 text-center shadow-sm sticky top-0 z-10">
    <h1 class="text-3xl font-extrabold text-gray-900">☀ GOOD NEWS TODAY</h1>
    <p class="text-gray-500 text-sm mt-2 font-medium">前向きな話題を厳選 あなたの一日を明るい気持ちでスタートできるニュースサイト</p>
  </header>

  <div class="max-w-3xl mx-auto mt-6 text-center flex justify-center">
    <!-- ↓ ここに広告コードを貼り付けます ↓ -->
    
    
    <!-- ↑ ここまで ↑ -->
  </div>

  <main class="max-w-3xl mx-auto p-4 mt-4" id="news-container">
    <p class="text-center text-gray-500 py-10">ニュースを読み込んでいます...</p>
  </main>

  <script>
    function getSavedLikes() {
      return JSON.parse(localStorage.getItem('goodNewsLikes') || '[]');
    }

    function toggleLike(button, link) {
      let likes = getSavedLikes();
      
      if (likes.includes(link)) {
        likes = likes.filter(l => l !== link);
        button.classList.remove('text-orange-500', 'bg-orange-50');
        button.classList.add('text-gray-400', 'hover:bg-gray-100');
      } else {
        likes.push(link);
        button.classList.remove('text-gray-400', 'hover:bg-gray-100');
        button.classList.add('text-orange-500', 'bg-orange-50');
        button.style.transform = 'scale(1.15) translateY(-2px)';
        setTimeout(() => button.style.transform = 'scale(1) translateY(0)', 200);
      }
      
      localStorage.setItem('goodNewsLikes', JSON.stringify(likes));
    }

    async function loadNews() {
      try {
        const res = await fetch("./data.json");
        const newsList = await res.json();
        const container = document.getElementById('news-container');
        const likes = getSavedLikes();
        
        container.innerHTML = newsList.map(item => {
          const isLiked = likes.includes(item.link);
          const likeBtnClass = isLiked ? 'text-orange-500 bg-orange-50' : 'text-gray-400 hover:bg-gray-100';

          return `
          <article class="bg-white rounded-2xl shadow-sm mb-6 border border-gray-100 hover:shadow-lg transition duration-300 overflow-hidden flex flex-col md:flex-row">
            
            <div class="md:w-1/3 h-48 md:h-auto flex-shrink-0">
              <img src="${item.image}" alt="ニュース画像" class="w-full h-full object-cover">
            </div>
            
            <div class="p-6 md:w-2/3 flex flex-col justify-center w-full">
              <div>
                <span class="bg-yellow-100 text-yellow-800 text-xs font-bold px-3 py-1 rounded-full mb-3 inline-block">ポジティブ</span>
              </div>
              <h2 class="font-bold text-xl text-gray-900 mb-2 leading-snug">${item.title}</h2>
              <p class="text-gray-600 text-sm mb-4 leading-relaxed">${item.snippet || ''}</p>
              
              <div class="mt-auto flex items-center justify-between border-t border-gray-50 pt-4">
                
                <button onclick="toggleLike(this, '${item.link}')" class="flex items-center gap-1.5 px-3 py-1.5 rounded-full font-bold text-sm transition-all duration-200 ${likeBtnClass}">
                  <svg class="w-6 h-6" fill="currentColor" viewBox="0 0 20 20">
                    <path d="M2 10.5a1.5 1.5 0 113 0v6a1.5 1.5 0 01-3 0v-6zM6 10.333v5.43a2 2 0 001.106 1.79l.05.025A4 4 0 008.943 18h5.416a2 2 0 001.962-1.608l1.2-6A2 2 0 0015.56 8H12V4a2 2 0 00-2-2 1 1 0 00-1 1v.667a4 4 0 01-.8 2.4L6.8 7.933a4 4 0 00-.8 2.4z"></path>
                  </svg>
                  GOOD NEWS
                </button>

                <a href="${item.link}" target="_blank" rel="noopener" class="inline-flex items-center text-blue-600 font-semibold hover:text-blue-800">
                  記事を読む <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
                </a>
              </div>
            </div>
          </article>
        `}).join('');
      } catch (error) {
        document.getElementById('news-container').innerHTML = '<p class="text-center text-gray-500">現在、最新のニュースを集めています。しばらくお待ちください。</p>';
      }
    }
    loadNews();
  </script>
</body>
</html>
