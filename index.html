<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HappyNews | 心温まる明るいニュースだけを厳選</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-50 text-gray-800 font-sans">
  <header class="bg-white border-b-4 border-yellow-400 p-6 text-center shadow-sm sticky top-0 z-10">
    <h1 class="text-3xl font-extrabold text-gray-900">☀️️ HappyNews</h1>
    <p class="text-gray-500 text-sm mt-2 font-medium">AIが選んだ、今日を少し良くするニュース</p>
  </header>

  <!-- 広告用スペース（ここに後からAdSenseなどを貼ります） -->
  <div class="max-w-3xl mx-auto mt-6 bg-gray-200 text-gray-400 text-center py-8 border-2 border-dashed border-gray-300 rounded-lg">
    <p class="text-sm">【ここに収益化のための広告が表示されます】</p>
  </div>

  <main class="max-w-3xl mx-auto p-4 mt-4" id="news-container">
    <p class="text-center text-gray-500 py-10">ニュースを読み込んでいます...</p>
  </main>

  <script>
    // 自動更新されるデータを読み込む
    async function loadNews() {
      try {
        const res = await fetch("./data.json");
        const newsList = await res.json();
        const container = document.getElementById('news-container');
        
        container.innerHTML = newsList.map(item => `
          <article class="bg-white p-6 rounded-2xl shadow-sm mb-6 border border-gray-100 hover:shadow-lg transition duration-300">
            <span class="bg-yellow-100 text-yellow-800 text-xs font-bold px-3 py-1 rounded-full mb-3 inline-block">ポジティブ</span>
            <h2 class="font-bold text-xl text-gray-900 mb-3 leading-snug">${item.title}</h2>
            <a href="${item.link}" target="_blank" rel="noopener" class="inline-flex items-center text-blue-600 font-semibold hover:text-blue-800">
              記事を読む <svg class="w-4 h-4 ml-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path></svg>
            </a>
          </article>
        `).join('');
      } catch (error) {
        document.getElementById('news-container').innerHTML = '<p class="text-center text-gray-500">現在、最新のハッピーニュースを集めています。しばらくお待ちください。</p>';
      }
    }
    loadNews();
  </script>
</body>
</html>
